{{- if .Values.config.services.deviceGtw.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idv.fullname" . }}-device-gateway
  labels:
    {{- include "idv.deviceGateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.deviceGateway.autoscaling.enabled }}
  replicas: {{ .Values.deviceGateway.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "idv.deviceGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configs/idv-config.yaml") . | sha256sum }}
        checksum/version: {{ .Values.versionSha | quote }}
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "idv.deviceGateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "idv.serviceAccountName" . }}
      {{- with .Values.deviceGateway.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deviceGateway.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deviceGateway.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deviceGateway.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if .Values.licenseSecretName }}
      - name: license
        secret:
          secretName: {{ .Values.licenseSecretName }}
      {{- end }}
      - name: idv-config
        configMap:
          name: {{ include "idv.fullname" . }}-config
          items:
            - key: idv-config
              path: idv-config.yaml
      {{- if and (hasKey .Values.config.storage "gcs") .Values.config.storage.gcs.gcsKeyJsonSecretName }}
      - name: gcs-credentials
        secret:
          secretName: {{ template "idv.gcs.credentials.secret" . }}
      {{- end }}
      {{- if or .Values.tls.trustedCABundle.configMapName .Values.extraVolumes }}
      {{- include "idv.extraVolumes" . | nindent 6 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.deviceGateway.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.deviceGateway.terminationGracePeriodSeconds }}
      {{- end }}
      {{- include "idv.minioInitContainer" . | nindent 6 }}
      containers:
      - name: device-gateway
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources: {{- toYaml .Values.deviceGateway.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.securityContext | nindent 10 }}
        {{- if .Values.deviceGateway.probes.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: /api/v1/device-gtw/ping
            port: device-gateway
          initialDelaySeconds: {{ .Values.deviceGateway.probes.livenessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.deviceGateway.probes.livenessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.deviceGateway.probes.livenessProbe.periodSeconds }}
          failureThreshold: {{ .Values.deviceGateway.probes.livenessProbe.failureThreshold }}
          successThreshold: {{ .Values.deviceGateway.probes.livenessProbe.successThreshold }}
        {{- end }}
        {{- if .Values.deviceGateway.probes.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: /api/v1/device-gtw/health
            port: device-gateway
          initialDelaySeconds: {{ .Values.deviceGateway.probes.readinessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.deviceGateway.probes.readinessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.deviceGateway.probes.readinessProbe.periodSeconds }}
          failureThreshold: {{ .Values.deviceGateway.probes.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.deviceGateway.probes.readinessProbe.successThreshold }}
        {{- end }}
        {{- if .Values.deviceGateway.probes.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: /api/v1/device-gtw/health
            port: device-gateway
          initialDelaySeconds: {{ .Values.deviceGateway.probes.startupProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.deviceGateway.probes.startupProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.deviceGateway.probes.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.deviceGateway.probes.startupProbe.failureThreshold }}
          successThreshold: {{ .Values.deviceGateway.probes.startupProbe.successThreshold }}
        {{- end }}
        lifecycle: {{- toYaml .Values.deviceGateway.lifecycle | nindent 10 }}
        ports:
        - name: device-gateway
          containerPort: {{ .Values.config.services.deviceGtw.port }}
          protocol: TCP
        volumeMounts:
        {{- if .Values.licenseSecretName }}
        - name: license
          mountPath: /app/extBin/unix/regula.license
          subPath: regula.license
          readOnly: true
        {{- end }}
        - name: idv-config
          mountPath: /app/config.yaml
          subPath: idv-config.yaml
        {{- if and (hasKey .Values.config.storage "gcs") .Values.config.storage.gcs.gcsKeyJsonSecretName }}
        - name: gcs-credentials
          mountPath: /etc/credentials/gcs_key.json
          subPath: gcs_key.json
          readOnly: true
        {{- end }}
        {{- if or .Values.tls.trustedCABundle.configMapName .Values.extraVolumeMounts }}
        {{- include "idv.extraVolumeMounts" . | nindent 8 }}
        {{- end }}
        command: ["idv"]
        args: ["device-gateway", "start"]
        {{- if .Values.tls.trustedCABundle.configMapName }}
        env: {{- tpl (include "idv.fullEnv" .) $ | nindent 10 }}
        {{- else }}
        env: {{- tpl (toYaml .Values.env) . | nindent 10 }}
        {{- end }}
{{- end }}
