{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "idv.fullname" . }}
  labels:
    {{- include "idv.labels" . | nindent 4 }}
  {{- with .Values.networkPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  policyTypes:
    {{- if .Values.networkPolicy.ingress }}
    - Ingress
    {{- end }}
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  # Component pods are labelled `app.kubernetes.io/instance: <release>-<component>`, so select
  # every component of this release by name rather than by the bare release name.
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: {{ .Release.Service }}
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name }}-backoffice
          {{- if .Values.config.services.frontoffice.enabled }}
          - {{ .Release.Name }}-frontoffice
          {{- end }}
          {{- if .Values.config.services.deviceGtw.enabled }}
          - {{ .Release.Name }}-device-gateway
          {{- end }}
          - {{ .Release.Name }}-workflow
          - {{ .Release.Name }}-scheduler
          - {{ .Release.Name }}-audit
          - {{ .Release.Name }}-indexer
  {{- if .Values.networkPolicy.ingress }}
  ingress: {{- toYaml .Values.networkPolicy.ingress | nindent 4 -}}
  {{- end -}}
  {{- if .Values.networkPolicy.egress }}
  egress: {{- toYaml .Values.networkPolicy.egress | nindent 4 -}}
  {{- end -}}
{{- end }}
