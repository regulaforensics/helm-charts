{{- /*
Deprecated: keeps the pre-3.10 Service name `<release>-api` pointing at the Backoffice pods, so
clients and external load balancers that use the old name keep working after the upgrade.
Same settings as the Backoffice Service.
*/ -}}
{{- include "idv.compat" . }}
{{- if .Values.backoffice.legacyApiService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idv.fullname" . }}-api
  labels:
    {{- include "idv.backoffice.labels" . | nindent 4 }}
  {{- with .Values.backoffice.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backoffice.service.type }}
  ports:
    - port: {{ .Values.backoffice.service.port }}
      targetPort: api
      protocol: TCP
      name: api
  {{- if .Values.backoffice.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.backoffice.service.loadBalancerIP }}
  {{- end }}
  {{- if .Values.backoffice.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml .Values.backoffice.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "idv.backoffice.selectorLabels" . | nindent 4 }}
{{- end }}
