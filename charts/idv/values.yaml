    pathType: Prefix
    # TLS configuration for the Device Gateway Ingress
    tls: []
    #  - secretName: device-gateway-example-tls
    #    hosts:
    #      - device-gateway.domain.com

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
