ingress:
  enabled: false
  # The Ingress Class for the web Ingress (used only with Kubernetes v1.19 and above)
  className: ""
  annotations: {}
  # The hostnames or hosts configuration for the web Ingress
  hosts: []
    # - idv.domain.com
  paths: []
    # - /
    # - path: /api
    #   service:
    #     name: my-api-service
    #     port: 8080
    # - path: /metrics
    #   action: metrics-block
  pathType: Prefix
  # TLS configuration for the IDV Ingress
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# You need to configure Gateway API in your cluster prior to using the route configuration
route:
  main:
    # -- Enables or disables the route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1
    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    annotations: {}
    labels: {}

    hostnames: []
    # - my-filter.example.com
    parentRefs: []
    # - name: acme-gw

    # -- create http route for redirect (https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#http-to-https-redirects)
    ## Take care that you only enable this on the http listener of the gateway to avoid an infinite redirect.
    ## matches, filters and additionalRules will be ignored if this is set to true. Be are
    httpsRedirect: false

    matches:
      - path:
          type: PathPrefix
          value: /

    ## Filters define the filters that are applied to requests that match this rule.
    filters: []

    ## Additional custom rules that can be added to the route
    additionalRules: []

networkPolicy:
  enabled: false
  annotations: {}
  ingress: {}
    # # allow ingress traffic from local namespace only
    # - from:
