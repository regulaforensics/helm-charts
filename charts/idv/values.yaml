  logging:
    level: INFO
    formatter: "%(asctime)s.%(msecs)03d - %(name)s - %(levelname)s - %(message)s"
    console: true
    file: false
    path: /var/log
    maxFileSize: 10485760
    filesCount: 10

  metrics:
    statsd:
      enabled: false
      host: null
      port: 9125
      prefix: idv

  deviceRegistration:
    enabled: false

  # DEPRECATED: This configuration is retained for backward compatibility
  # and initial migration to the platform database.
  # Values are migrated only when the corresponding database settings do not exist.
  # Existing database settings take precedence and are not overwritten.
