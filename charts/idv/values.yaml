config:
  # Root base URL. Used as a fallback for any service that does not set its own `baseUrl`
  # (e.g. `services.backoffice.baseUrl`).
  baseUrl: "http://idv.example.com"
  fernetKey: "tton53xJw0QV6vfaOTNRP_YGnPc76ZJkXFdVFZSnaKQ="
  tenant: null
  env: null
  identifier: null
  basicAuth:
    enabled: true

  services:
    # Backoffice (API) service.
    # Renamed from `api` in 3.10. The old `config.services.api` key still works (deprecated,
    # merged over these defaults by the `idv.compat` helper) and prints a DEPRECATED note on install.
    backoffice:
      # Optional public base URL of the backoffice. When null, the root `config.baseUrl` is used.
      # Example: "https://api.example.com"
      baseUrl: ~
      port: 8000
      host: 0.0.0.0
      workers: auto
      threads: auto
      keepalive: 120
      timeout: 120
      # DEPRECATED: This configuration is retained for backward compatibility
      # and initial migration to the platform database.
      # Values are migrated only when the corresponding database settings do not exist.
      # Existing database settings take precedence and are not overwritten.
      # Manage these settings through the platform administrative settings after initialization.
      # This configuration will be removed from the Helm chart in the next release.
      cors:
        enabled: false
        origins: "*"
        methods: "*"
        headers: "*"
        maxAge: 0
      maxBodySize: 64Mi
      openapi: false

    # Frontoffice service. Not supported in this release. Keep disabled.
    # When enabled, the chart deploys a dedicated frontoffice Deployment/Service and (optionally)
    # a dedicated Ingress under the `frontoffice` section above.
    frontoffice:
      # Enable the frontoffice service. When false, no frontoffice resources are rendered.
      enabled: false
      # Optional public base URL of the frontoffice. When null, the root `config.baseUrl` is used.
      # Example: "https://frontoffice.example.com"
      baseUrl: ~
      # Expose the OpenAPI docs for the frontoffice service
      openapi: true
      # Internal port the frontoffice process listens on (must match frontoffice.service targetPort)
      port: 8001
      # Bind host inside the container
      host: "0.0.0.0"
      # Number of worker processes ("auto" derives from available CPUs)
      workers: auto
      # Number of threads per worker ("auto" derives from available CPUs)
      threads: auto
      # Seconds to keep idle client connections open
      keepalive: 120
      # Request timeout in seconds
      timeout: 30
      # Maximum accepted request body size
      maxBodySize: 64Mi

    # Device Gateway service. Not supported in this release. Keep disabled.
    # When enabled, the chart deploys a dedicated Deployment/Service and (optionally)
    # a dedicated Ingress under the `deviceGateway` section above.
    deviceGtw:
      # Enable the Device Gateway service. When false, no Device Gateway resources are rendered.
      enabled: false
      # Optional public base URL of the Device Gateway. When null, the root `config.baseUrl` is used.
      # Example: "https://device-gateway.example.com"
      baseUrl: ~
      # Expose the OpenAPI docs for the Device Gateway service
      openapi: false
      # Internal port the Device Gateway process listens on (the Service targets it by name)
      port: 8002
      # Bind host inside the container
      host: "0.0.0.0"
      # Number of worker processes ("auto" derives from available CPUs)
      workers: auto
      # Number of threads per worker ("auto" derives from available CPUs)
      threads: auto
      # Seconds to keep idle client connections open
      keepalive: 120
      # Request timeout in seconds
      timeout: 30
      # Maximum accepted request body size
      maxBodySize: 64Mi

    workflow:
      # Number of worker processes ("auto" derives from available CPUs)
      workers: auto
      # Number of threads per worker
      threads: 32

    scheduler:
      jobs:
        reloadWorkflows:
          cron: '*/15 * * * * *'
        expireSessions:
          cron: '*/10 * * * * *'
        # cleanSessions is ommitted by default to keep session data forever
        # uncomment and configure the following lines to enable session data cleanup
        # cleanSessions:
        #   cron: '*/30 * * * * *'
        #   keepFor: 1d
        expireDeviceLogs:
          cron: '*/5 * * * *'
          keepFor: 30d
        reloadLocales:
          cron: '*/15 * * * * *'
        cronWorkflow:
          cron: '*/30 * * * * *'

    audit:
      # Number of worker processes ("auto" derives from available CPUs)
      workers: auto
      # Number of threads per worker
      threads: 32
      wsEnabled: false
      user:
        keepFor: "90d"

    indexer:
      timeout: 60
      maxBatchSize: 1000

    docreader:
      enabled: false
      prefix: drapi
      url: ''

    faceapi:
      enabled: false
      # when integration is enabled, the service mode tells faceapi how it will be used by IDV
      # currently only "idv" is supported
      mode: idv
      prefix: faceapi
      url: ''

    ip2location:
      enabled: false
      type: regula
      regula:
        url: https://lic.regulaforensics.com
        timeout: 3

    livekit:
      enabled: false
      url: https://livekit.example.com
      # apiKey and apiSecret are sensitive values and should be provided via environment variables
      # See the 'env' section below for examples of how to reference them from Kubernetes Secrets
      apiKey: null
      apiSecret: null
      egress:
        enabled: false

  mongo:
    url: "mongodb://mongodb:27017/idv"

  messageBroker:
    url: "amqp://rabbitmq:5672/"

  storage:
    # Storage backend type: one of `s3`, `az`, `gcs`.
    type: s3
    # S3 (or S3-compatible, e.g. MinIO) object storage.
    s3:
      # Single bucket used for all IDV data. Each entity below is separated by its `location.prefix`.
      bucket: "idv-bucket"
      endpoint: ""
      accessKey: null
      accessSecret: null
      region: "eu-central-1"
      secure: true
    # az:
    #   # Single Azure Blob container used for all IDV data.
    #   container: "idv"
    #   storageAccount: ""
    #   # `connectionString` is a sensitive value, consider using Kubernetes Secret to provide it,
    #   # see `IDV_CONFIG__STORAGE__AZ__CONNECTIONSTRING` env variable in the env section below
    #   connectionString: ~
    # gcs:
    #   # Single GCS bucket used for all IDV data.
    #   bucket: "idv-bucket"
    #   #  Supply the name of existing secret with service account key gcs.json file.
    #   # You can load it to a k8s generic secret via the following command:
    #   #  `kubectl create secret generic gcs-credentials -n <namespace> --from-file=gcs_key.json=<path_to_key>`
    #   gcsKeyJsonSecretName: ~

    # Per-entity object key prefixes within the backend bucket/container.
    sessions:
      location:
        prefix: "sessions"
    persons:
      location:
        prefix: "persons"
    workflows:
      location:
        prefix: "workflows"
    userFiles:
      location:
        prefix: "files"
    locales:
      location:
        prefix: "localization"
    assets:
      location:
        prefix: "assets"

    tempFiles:
      location:
        prefix: "files/tmp"

    banlists:
      location:
        prefix: "banlist"

    thumbnails:
      location:
        prefix: "thumbnails"

  faceSearch:
    # Set opensearch.enabled.true if 'faceSearch' is enabled
    enabled: false
    limit: 1000
    threshold: 0.75
    database:
      type: opensearch
      opensearch:
        host: "opensearch"
        port: "9200"
        useSsl: false
        verifyCerts: false
        method: "hnsw"
        username: null
        password: null
        dimension: 512
        awsAuth:
          enabled: false
          region: null
          accessKey: null
          secretKey: null
      # type: atlas
      atlas: {}

  textSearch:
    # Set opensearch.enabled.true if 'textSearch' is enabled
    enabled: false
    limit: 1000
    database:
      type: opensearch
      opensearch:
        host: "opensearch"
        port: "9200"
        useSsl: false
        verifyCerts: false
        username: null
        password: null
        awsAuth:
          enabled: false
          region: null
          accessKey: null
          secretKey: null
      # type: atlas
      atlas: {}

  # DEPRECATED: This configuration is retained for backward compatibility
  # and initial migration to the platform database.
  # Values are migrated only when the corresponding database settings do not exist.
  # Existing database settings take precedence and are not overwritten.
  # Manage these settings through the platform administrative settings after initialization.
  # This configuration will be removed from the Helm chart in the next release.
  mobile: {}

  # DEPRECATED: This configuration is retained for backward compatibility
  # and initial migration to the platform database.
  # Values are migrated only when the corresponding database settings do not exist.
  # Existing database settings take precedence and are not overwritten.
  # Manage these settings through the platform administrative settings after initialization.
