nameOverride: ""
fullnameOverride: ""

commonLabels: {}

podAnnotations: {}

podSecurityContext: {}
securityContext: {}

# Extra volumes and volumeMounts added to every IDV deployment. Empty by default (no change to
# existing deployments).
extraVolumes: []
extraVolumeMounts: []

# Optional: trust an internal/private CA for in-cluster TLS to backends without rebuilding the
# image. Point `configMapName` at a ConfigMap (e.g. produced by cert-manager trust-manager)
# holding a CA bundle under `key`. When set, the chart mounts the bundle at `mountPath`,
# overlays it onto the image's CA store(s) listed in `caStorePaths`, and sets SSL_CERT_FILE /
# REQUESTS_CA_BUNDLE / AWS_CA_BUNDLE env vars so all Python TLS clients trust certificates
# signed by that CA. Disabled by default.
tls:
  trustedCABundle:
    configMapName: ""
    key: ca-bundle.pem
    # Directory the bundle is mounted at (use this path for e.g. MongoDB tlsCAFile).
    mountPath: /etc/regula/tls
    # CA-store files to overlay with the bundle. Defaults target the idv-coordinator image;
    # update when the image changes Python version.
    caStorePaths:
      - /app/.venv/lib/python3.11/site-packages/botocore/cacert.pem
      - /app/.venv/lib/python3.11/site-packages/certifi/cacert.pem
      - /etc/pki/tls/cert.pem

versionSha: latest

image:
  repository: regulaforensics/idv-coordinator
  pullPolicy: IfNotPresent
  tag: ""
imagePullSecrets: {}

# Supply the name of existing secret with the regula.license file.
# You can load it to a k8s generic secret via the following command:
# `kubectl create secret generic idv-license -n <namespace> --from-file=regula.license=/path/to/file`
#
licenseSecretName: null

backoffice:
  replicas: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}
    # requests:
    #   cpu: "1500m"
    #   memory: "512Mi"
  topologySpreadConstraints: []

  terminationGracePeriodSeconds: 45

  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 30"]

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    loadBalancerSourceRanges: []

  # Deprecated: also create the pre-3.10 Service `<release>-api`, pointing at
  # the Backoffice pods with the same settings as `backoffice.service`. Keeps clients and external
  # load balancers that use the old name working after the upgrade. Set to false once nothing
  # uses `<release>-api` any more.
  legacyApiService:
    enabled: true

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    # Either HPA or KEDA can be enabled at a time for autoscaling
    keda:
      enabled: false
      # KEDA-specific replica count settings (override autoscaling.minReplicas/maxReplicas)
      # minReplicaCount: 1
      # maxReplicaCount: 100
      # cooldownPeriod: 300
      # pollingInterval: 30
      triggers: []
      TriggerAuthentication: null
      # Optional: fallback behavior when the metric source is unavailable
      # (e.g. RabbitMQ queue not yet created in ephemeral PR environments).
      # KEDA will hold `replicas` replicas after `failureThreshold` consecutive errors,
      # then resume normal scaling once the metric source recovers.
      # fallback:
      #   failureThreshold: 3
      #   replicas: 1
      # Optional: HPA scaling behavior
      # .stabilizationWindowSeconds prevents reacting to short CPU/metric spikes (e.g. during pod startup)
      # by requiring the metric to stay above threshold for the full window before scaling up or down.
      # advanced:
      #   scaleUp:
      #     stabilizationWindowSeconds: 180
      #   scaleDown:
      #     stabilizationWindowSeconds: 300

  # Backoffice pod disruption budget
  podDisruptionBudget:
    enabled: false
    # PDB configuration
    config:
      # minAvailable and maxUnavailable cannot be both set
      maxUnavailable: ~
      minAvailable: 1

  probes:
    livenessProbe:
      enabled: true
      initialDelaySeconds: 5
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      enabled: false
      initialDelaySeconds: 10
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3

# Frontoffice component. Not supported in this release. Keep disabled.
# These resources are only rendered when `config.services.frontoffice.enabled: true`.
frontoffice:
  replicas: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}
    # requests:
    #   cpu: "1000m"
    #   memory: "512Mi"
  topologySpreadConstraints: []

  terminationGracePeriodSeconds: 45

  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 30"]

  service:
    type: ClusterIP
    port: 80
    annotations: {}
    loadBalancerSourceRanges: []

  # Dedicated Ingress for the public frontoffice entrypoint. Kept separate from the top-level
  # `ingress` (which fronts the backoffice/API) so the public service can use its own hostname,
  # TLS certificate, ingressClass, and annotations. Requires `config.services.frontoffice.enabled`.
  ingress:
    # Enable a dedicated Ingress for the frontoffice service
    enabled: false
    # The Ingress Class for the frontoffice Ingress (Kubernetes v1.19+)
    className: ""
    annotations: {}
    # The hostnames for the frontoffice Ingress
    hosts: []
      # - frontoffice.domain.com
    # Paths default to the frontoffice service when no per-path service is given
    paths: []
      # - /
      # - path: /
      #   service:
      #     name: my-frontoffice-service
      #     port: 8080
    pathType: Prefix
    # TLS configuration for the frontoffice Ingress
    tls: []
    #  - secretName: frontoffice-example-tls
    #    hosts:
    #      - frontoffice.domain.com

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    # Either HPA or KEDA can be enabled at a time for autoscaling
    keda:
      enabled: false
      # KEDA-specific replica count settings (override autoscaling.minReplicas/maxReplicas)
      # minReplicaCount: 1
      # maxReplicaCount: 100
      # cooldownPeriod: 300
      # pollingInterval: 30
      triggers: []
      TriggerAuthentication: null
      # Optional: fallback behavior when the metric source is unavailable
      # (e.g. RabbitMQ queue not yet created in ephemeral PR environments).
      # KEDA will hold `replicas` replicas after `failureThreshold` consecutive errors,
      # then resume normal scaling once the metric source recovers.
      # fallback:
      #   failureThreshold: 3
      #   replicas: 1
      # Optional: HPA scaling behavior
      # .stabilizationWindowSeconds prevents reacting to short CPU/metric spikes (e.g. during pod startup)
      # by requiring the metric to stay above threshold for the full window before scaling up or down.
      # advanced:
      #   scaleUp:
      #     stabilizationWindowSeconds: 180
      #   scaleDown:
      #     stabilizationWindowSeconds: 300

  # Frontoffice pod disruption budget
  podDisruptionBudget:
    enabled: false
    # PDB configuration
    config:
      # minAvailable and maxUnavailable cannot be both set
      maxUnavailable: ~
      minAvailable: 1

  probes:
    livenessProbe:
      enabled: true
      initialDelaySeconds: 5
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      enabled: false
      initialDelaySeconds: 10
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3

