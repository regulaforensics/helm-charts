## prometheus-statsd-exporter
statsd:
  enabled: false
  statsd:
    mappingConfig: |-
      mappings:
      - match: "idv.(.*)_http_method_(.*)_route_(.*)_status_(.*)_duration"
        name: "idv_${1}_http_duration"
        match_type: regex
        labels:
          service: "$1"
          method: "$2"
          url_rule: "$3"
          status: "$4"

      - match: "idv.(.*)_http_status_(.*)_total"
        name: "idv_${1}_http_request_total"
        match_type: regex
        labels:
          service: "$1"
          status: "$2"

      - match: "idv.(mongo|vector_db|text_search|storage)_([^_]+)_(.+)_duration"
        name: "idv_${1}_duration"
        match_type: regex
        observer_type: summary
        summary_options:
          quantiles:
            - quantile: 0.5
              error: 0.05
            - quantile: 0.9
              error: 0.02
            - quantile: 0.95
              error: 0.01
            - quantile: 0.99
              error: 0.001
        labels:
          type: "$1"
          repo: "$2"
          operation: "$3"

      - match: "idv.(mongo|vector_db|text_search|storage)_([^_]+)_(.+)_success_count"
        name: "idv_${1}_success_count"
        match_type: regex
        labels:
          type: "$1"
          repo: "$2"
          operation: "$3"

      - match: "idv.(mongo|vector_db|text_search|storage)_([^_]+)_(.+)_error_count"
        name: "idv_${1}_error_count"
        match_type: regex
        labels:
          type: "$1"
          repo: "$2"
          operation: "$3"

      - match: "idv.(mongo|vector_db|text_search|storage)_([^_]+)_(.+)_count"
        name: "idv_${1}_total"
        match_type: regex
        labels:
          type: "$1"
          repo: "$2"
          operation: "$3"

      - match: "idv.(.*)_(.*)_duration"
        name: "idv_${1}_duration"
        match_type: regex
        labels:
          service: "$1"
          operation: "$2"

      - match: "idv.(.*)_(.*)_(.*)_condition_eval_count"
        name: "idv_workflow_step_condition_eval_count"
        match_type: regex
        labels:
          workflow_id: "$1"
          condition: "$2"
          result: "$3"

      - match: "idv.(.*)_(.*)_error_count"
        name: "idv_error"
        match_type: regex
        labels:
          service: "$1"
          operation: "$2"

      - match: "idv.(.*)_(.*)_success_count"
        name: "idv_${1}_success_count"
        match_type: regex
        labels:
          service: "$1"
          operation: "$2"

      - match: "idv.(.*)_(.*)_error_count"
        name: "idv_${1}_error_count"
        match_type: regex
        labels:
          service: "$1"
          operation: "$2"

      - match: "idv.(.*)_(.*)_count"
        name: "idv_${1}_total"
        match_type: regex
        labels:
          service: "$1"
          operation: "$2"

# NOTE
# The subcharts below are used for the demonstration and Dev/Test purposes.
# We strongly recommend to deploy separate installations of the DB in Production.
# Images are pinned to `bitnamilegacy/*`, a frozen mirror that is still publicly pullable, because
# Bitnami's default image repositories now require a commercial subscription.

mongodb:
  enabled: false
  image:
    repository: bitnamilegacy/mongodb
  fullnameOverride: mongodb
  architecture: standalone
  auth:
    enabled: false

rabbitmq:
  enabled: false
  image:
    repository: bitnamilegacy/rabbitmq
  auth:
    username: idv
    password: "admin"

# S3-compatible object store for exercising `config.storage.type: s3` without AWS.
# When enabled, overrides `config.storage.s3`.
minio:
  enabled: false
  # Also used as the S3 access key and secret in `config.storage.s3`.
  auth:
    rootUser: user
    rootPassword: password123
  # Single pod; upstream defaults to `distributed` (4 replicas).
  mode: standalone
  persistence:
    size: 10Gi
  # The bucket is created by the `init-minio-bucket` init container from
  # `config.storage.s3.bucket`, not by this subchart.
  image:
    repository: bitnamilegacy/minio
  # `mc` client, used by the init container above.
  clientImage:
    repository: bitnamilegacy/minio-client
    # Upstream defines no pull policy for this image.
    pullPolicy: IfNotPresent
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  # Web console; a separate Deployment in this chart.
  console:
    enabled: false
    image:
      repository: bitnamilegacy/minio-object-browser

opensearch:
  enabled: false
  fullnameOverride: opensearch
  opensearchPassword: ""
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
  securityConfig:
    enabled: true
  nodeGroup: single-node
  singleNode: true
  config:
    opensearch.yml: |
      discovery.type: single-node
      plugins.security.disabled: true
      bootstrap.memory_lock: true
  extraEnvs:
    - name: OPENSEARCH_JAVA_OPTS
      value: "-Xms128m -Xmx512m"
